name: Harness MVP checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'
      - name: Syntax and isolated tests
        run: |
          python -m compileall -q seealpha_harness tests
          python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build resident Harness image
        run: |
          printf '%s\n' 'HARNESS_API_TOKEN=ci-only-example-token-12345678901234567890' > .env
          mkdir -p .local
          sudo install -d -m 700 -o 10001 -g 10001 .local/state
          docker compose build harness
      - name: Build separate trusted gateway image (no model SDK)
        run: docker build -f docker/gateway.Dockerfile --tag seealpha-gateway:mvp .
      - name: Build optional trusted MCP Bridge service image (not launched per task)
        run: docker build -f docker/mcp-bridge.Dockerfile --tag seealpha-mcp-bridge:mvp .
      - name: Smoke test Compose health and SDK startup (no model request)
        run: |
          trap 'docker compose logs harness; docker compose down' EXIT
          docker compose up -d --wait --wait-timeout 120 harness
          curl -fsS http://127.0.0.1:8777/health | grep -q 'seealpha-harness'
          docker compose exec -T harness python - <<'PY'
          from deepseek_harness import DeepSeekHarness

          with DeepSeekHarness(
              dsh_home="/state/sdk-smoke",
              cwd="/state",
              provider="deepseek-official",
              model="deepseek-v4-flash",
              profile="sdk-minimal",
          ):
              pass
          PY
