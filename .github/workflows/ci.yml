name: Harness MVP checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'
      - name: Syntax and isolated tests
        run: |
          python -m compileall -q seealpha_harness tests
          python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build independent image
        run: docker build --tag seealpha-harness:mvp .
      - name: Build separate trusted gateway image (no model SDK)
        run: docker build -f docker/gateway.Dockerfile --tag seealpha-gateway:mvp .
      - name: Build per-task MCP Bridge image without Agent SDK
        run: docker build -f docker/mcp-bridge.Dockerfile --tag seealpha-mcp-bridge:mvp .
      - name: Smoke test HTTP health (no model request)
        run: |
          docker run -d --name harness-smoke -p 127.0.0.1:18777:8777 \
            -e HARNESS_API_TOKEN=ci-only-example-token-12345678901234567890 \
            seealpha-harness:mvp
          trap 'docker logs harness-smoke; docker rm -f harness-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18777/health > /tmp/harness-health.json; then
              grep -q 'seealpha-harness' /tmp/harness-health.json
              exit 0
            fi
            sleep 2
          done
          exit 1
