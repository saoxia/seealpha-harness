# Local single-user development only. See README for known sandbox limits.
services:
  harness:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HARNESS_STATE_DIR: /state
      TMPDIR: /run/harness-sdk
    ports:
      - "127.0.0.1:8777:8777"
    volumes:
      - ./.local/state:/state
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /run/harness-sdk:rw,exec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8777/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
