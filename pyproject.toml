[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "seealpha-harness"
version = "0.1.0"
description = "Isolated local research agent service for SeeAlpha"
requires-python = ">=3.11,<3.15"
dependencies = [
    "deepseek-harness-sdk==0.2.1rc2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<10", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["seealpha_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
